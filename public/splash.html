<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ATS Cool Tool</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #1f1d94 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    
    .splash-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      padding: 6px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    
    .subtitle {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 30px;
    }
    
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    .loading-text {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">
  <img src="/logo.png" alt="ATS logo">
    </div>
    <div class="title">BOM Support Tool Suite</div>
    <div class="subtitle">Bill of Materials Translation & Management</div>
    <div class="loader"></div>
    <div class="loading-text">Loading application...</div>
  </div>
</body>
</html>
